name: build-ipa

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project FanTuFix.xcodeproj \
            -scheme FanTuFix \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            build 2>&1 | tail -n 120

      - name: Package ipa
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" build/Build/Products/Release-iphoneos/FanTuFix.app/Info.plist)
          BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" build/Build/Products/Release-iphoneos/FanTuFix.app/Info.plist)
          echo "IPA_VERSION=${VERSION}" >> "$GITHUB_ENV"
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/FanTuFix.app Payload/
          zip -qry "FanTuFix-v${VERSION}-b${BUILD}.ipa" Payload
          ls -lh FanTuFix-v*.ipa
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" Payload/FanTuFix.app/Info.plist

      - uses: actions/upload-artifact@v4
        with:
          name: FanTuFix-ipa
          path: FanTuFix-v*.ipa
          retention-days: 90
